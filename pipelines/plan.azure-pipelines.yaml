# ReportMate - Terraform plan validation (SAMPLE, plan only, never applies)
#
# Runs init against the remote backend, validate, and a read-only plan against
# live state using the same var file the deploy pipeline applies. Use it as a
# pull request check.
#
# Pull request code is untrusted, so this pipeline:
#   - uses a separate READ-ONLY service connection (Reader on the ReportMate
#     resource group, Storage Blob Data Reader on the state container), never
#     the deploy connection;
#   - links no secrets variable group and passes placeholder values for every
#     secret input, so secret-backed resources may show as changing in the plan;
#   - plans with -lock=false and never writes state.
# Never enable "make secrets available to builds of forks" for this pipeline.
#
# In Azure Repos, YAML `pr` triggers are ignored: gate pull requests with a
# build-validation branch policy on main that points at this pipeline. In
# GitHub-hosted repos you can set a `pr` trigger instead.
#
# This is a sample derived from a working production pipeline. Adapt every
# value under `variables` before use.

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - name: serviceConnectionReadOnly
    value: '<your-read-only-service-connection-name>'
  - name: terraformVersion
    value: '1.12.2'
  - name: terraformDir
    value: '.'
  # Plan and apply must read the same non-secret file, or the plan validates
  # something the deploy never runs.
  - name: varFile
    value: 'reportmate.prod.tfvars'
  - name: terraformBackendRG
    value: '<your-terraform-state-rg>'
  - name: terraformBackendSA
    value: '<your-terraform-state-storage>'
  - name: terraformBackendContainer
    value: 'terraform-state'
  - name: terraformBackendKey
    value: 'reportmate.tfstate'

steps:
  - checkout: self
    fetchDepth: 1

  - task: TerraformInstaller@1
    displayName: 'Install Terraform $(terraformVersion)'
    inputs:
      terraformVersion: $(terraformVersion)

  # The azurerm provider and backend reject "az CLI logged in as a service
  # principal", so authenticate them with OIDC directly.
  - task: AzureCLI@2
    displayName: 'Terraform Init + Validate + Plan (read-only, no lock)'
    inputs:
      azureSubscription: $(serviceConnectionReadOnly)
      addSpnToEnvironment: true
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: $(terraformDir)
      inlineScript: |
        set -euo pipefail
        export ARM_USE_OIDC=true ARM_USE_AZUREAD=true
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_TENANT_ID="$tenantId"
        export ARM_OIDC_TOKEN="$idToken"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        terraform init -input=false \
          -backend-config="resource_group_name=$(terraformBackendRG)" \
          -backend-config="storage_account_name=$(terraformBackendSA)" \
          -backend-config="container_name=$(terraformBackendContainer)" \
          -backend-config="key=$(terraformBackendKey)"
        terraform validate
        terraform plan -input=false -lock=false -var-file="$(varFile)"
    env:
      TF_VAR_db_password: 'placeholder-not-a-secret'
      TF_VAR_client_passphrases: 'placeholder-not-a-secret'
      TF_VAR_nextauth_secret: 'placeholder-not-a-secret'
      TF_VAR_api_internal_secret: 'placeholder-not-a-secret'
      TF_VAR_kiosk_tokens: ''
