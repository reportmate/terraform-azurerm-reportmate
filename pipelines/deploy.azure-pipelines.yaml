# ReportMate - deploy (SAMPLE)
#
# Stage 1 (Plan) checks the run is on main, validates the requested image tags
# and shows the Terraform plan. Stage 2 (Deploy) is a deployment job against a
# protected environment: after approval it mirrors the published images into
# your Azure Container Registry, applies Terraform, rolls both container apps,
# purges Front Door and checks health. Manual trigger only.
#
# This is a sample derived from a working production pipeline. Adapt every
# value under `variables` before use. Authentication is secretless: an Azure
# Resource Manager service connection using workload identity federation.
#
# Terraform does not roll either image: the containers module sets
# ignore_changes on the container image, so the pipeline owns the running tag
# and pushes it with `az containerapp update`. The image tag variables still
# matter so a from-scratch apply creates the apps with the right tag.
#
# Image tags are required at queue time and must be explicit release tags.
# They reach scripts only through environment variables and are validated
# before use. Each run imports them under a new, unique ACR tag
# (<source-tag>-<build-id>); nothing is overwritten and no :latest is written.

trigger: none
pr: none

parameters:
  - name: frontendSourceTag
    displayName: 'Frontend release tag in GHCR (explicit version, not latest)'
    type: string
  - name: apiSourceTag
    displayName: 'API release tag in GHCR (explicit version, not latest)'
    type: string

pool:
  vmImage: ubuntu-latest

# Secrets come from a variable group (here `reportmate-secrets`) holding
# DbPassword, ClientPassphrase, NextAuthSecret, ApiInternalSecret and
# KioskTokens. Terraform writes them into Key Vault; nothing secret lives in
# this YAML or in the var file. Restrict the group's pipeline permissions to
# this pipeline only.
variables:
  - group: reportmate-secrets
  - name: azureSubscription
    value: '<your-deploy-service-connection-name>'
  - name: deployEnvironment
    value: 'reportmate-production'
  - name: terraformVersion
    value: '1.12.2'
  - name: terraformDir
    value: '.'
  - name: varFile
    value: 'reportmate.prod.tfvars'
  - name: resourceGroup
    value: 'rg-reportmate'
  - name: registry
    value: '<your-acr-name>'
  - name: frontendRepo
    value: 'reportmate'
  - name: apiRepo
    value: 'reportmate-api'
  - name: frontendGhcrImage
    value: 'ghcr.io/reportmate/reportmate-app-web'
  - name: apiGhcrImage
    value: 'ghcr.io/reportmate/reportmate-api'
  - name: frontendContainerApp
    value: 'reportmate-web-app-prod'
  - name: apiContainerApp
    value: 'reportmate-functions-api'
  - name: apiBaseUrl
    value: 'https://<your-api-app>.<your-environment>.<region>.azurecontainerapps.io'
  - name: frontDoorProfile
    value: 'reportmate-frontdoor'
  - name: frontDoorEndpoint
    value: 'reportmate-endpoint'
  - name: customDomain
    value: 'reportmate.example.com'
  - name: terraformBackendRG
    value: '<your-terraform-state-rg>'
  - name: terraformBackendSA
    value: '<your-terraform-state-storage>'
  - name: terraformBackendContainer
    value: 'terraform-state'
  - name: terraformBackendKey
    value: 'reportmate.tfstate'

stages:
  - stage: Plan
    jobs:
      - job: Plan
        steps:
          - checkout: self
            fetchDepth: 1

          - bash: |
              set -euo pipefail
              if [ "$SOURCE_BRANCH" != "refs/heads/main" ]; then
                echo "##vso[task.logissue type=error]Deploy runs only from refs/heads/main (got $SOURCE_BRANCH)"
                exit 1
              fi
              for TAG in "$FRONTEND_SOURCE_TAG" "$API_SOURCE_TAG"; do
                if ! [[ "$TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
                  echo "##vso[task.logissue type=error]Invalid image tag: must match ^[A-Za-z0-9._-]{1,128}\$"
                  exit 1
                fi
                if [ "$TAG" = "latest" ]; then
                  echo "##vso[task.logissue type=error]Use an explicit release tag, not latest"
                  exit 1
                fi
              done
            displayName: 'Check branch and validate image tags'
            env:
              SOURCE_BRANCH: $(Build.SourceBranch)
              FRONTEND_SOURCE_TAG: ${{ parameters.frontendSourceTag }}
              API_SOURCE_TAG: ${{ parameters.apiSourceTag }}

          - task: TerraformInstaller@1
            displayName: 'Install Terraform $(terraformVersion)'
            inputs:
              terraformVersion: $(terraformVersion)

          - task: AzureCLI@2
            displayName: 'Terraform Init + Plan (review before approving)'
            inputs:
              azureSubscription: $(azureSubscription)
              addSpnToEnvironment: true
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(terraformDir)
              inlineScript: |
                set -euo pipefail
                export ARM_USE_OIDC=true ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                export TF_VAR_frontend_image_tag="${FRONTEND_SOURCE_TAG}-${BUILD_BUILDID}"
                export TF_VAR_api_image_tag="${API_SOURCE_TAG}-${BUILD_BUILDID}"
                terraform init -input=false \
                  -backend-config="resource_group_name=$(terraformBackendRG)" \
                  -backend-config="storage_account_name=$(terraformBackendSA)" \
                  -backend-config="container_name=$(terraformBackendContainer)" \
                  -backend-config="key=$(terraformBackendKey)"
                terraform plan -input=false -lock=false -var-file="$(varFile)"
            env:
              FRONTEND_SOURCE_TAG: ${{ parameters.frontendSourceTag }}
              API_SOURCE_TAG: ${{ parameters.apiSourceTag }}
              TF_VAR_db_password: $(DbPassword)
              TF_VAR_client_passphrases: $(ClientPassphrase)
              TF_VAR_nextauth_secret: $(NextAuthSecret)
              TF_VAR_api_internal_secret: $(ApiInternalSecret)
              TF_VAR_kiosk_tokens: $(KioskTokens)

  - stage: Deploy
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      # Configure approvals and checks on this environment in Azure DevOps;
      # the job waits for them before any step runs.
      - deployment: Deploy
        environment: ${{ variables.deployEnvironment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1

                - task: AzureCLI@2
                  displayName: 'Mirror images (GHCR -> ACR, unique tags)'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      for TAG in "$FRONTEND_SOURCE_TAG" "$API_SOURCE_TAG"; do
                        [[ "$TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]] && [ "$TAG" != "latest" ] || { echo "Invalid image tag"; exit 1; }
                      done
                      # `az acr import` copies server-side; no Docker daemon is
                      # needed. No --force: an existing target tag is an error.
                      az acr import --name "$(registry)" \
                        --source "$(frontendGhcrImage):${FRONTEND_SOURCE_TAG}" \
                        --image "$(frontendRepo):${FRONTEND_SOURCE_TAG}-${BUILD_BUILDID}"
                      az acr import --name "$(registry)" \
                        --source "$(apiGhcrImage):${API_SOURCE_TAG}" \
                        --image "$(apiRepo):${API_SOURCE_TAG}-${BUILD_BUILDID}"
                  env:
                    FRONTEND_SOURCE_TAG: ${{ parameters.frontendSourceTag }}
                    API_SOURCE_TAG: ${{ parameters.apiSourceTag }}

                - task: TerraformInstaller@1
                  displayName: 'Install Terraform $(terraformVersion)'
                  inputs:
                    terraformVersion: $(terraformVersion)

                - task: AzureCLI@2
                  displayName: 'Terraform Init + Plan + Apply'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    addSpnToEnvironment: true
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: $(terraformDir)
                    inlineScript: |
                      set -euo pipefail
                      export ARM_USE_OIDC=true ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID="$servicePrincipalId"
                      export ARM_TENANT_ID="$tenantId"
                      export ARM_OIDC_TOKEN="$idToken"
                      export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                      export TF_VAR_frontend_image_tag="${FRONTEND_SOURCE_TAG}-${BUILD_BUILDID}"
                      export TF_VAR_api_image_tag="${API_SOURCE_TAG}-${BUILD_BUILDID}"
                      terraform init -input=false \
                        -backend-config="resource_group_name=$(terraformBackendRG)" \
                        -backend-config="storage_account_name=$(terraformBackendSA)" \
                        -backend-config="container_name=$(terraformBackendContainer)" \
                        -backend-config="key=$(terraformBackendKey)"
                      terraform plan -input=false -var-file="$(varFile)" -out=tfplan
                      terraform apply -input=false -auto-approve tfplan
                      rm -f tfplan
                  # Secret variables are not exported to scripts automatically; map them.
                  env:
                    FRONTEND_SOURCE_TAG: ${{ parameters.frontendSourceTag }}
                    API_SOURCE_TAG: ${{ parameters.apiSourceTag }}
                    TF_VAR_db_password: $(DbPassword)
                    TF_VAR_client_passphrases: $(ClientPassphrase)
                    TF_VAR_nextauth_secret: $(NextAuthSecret)
                    TF_VAR_api_internal_secret: $(ApiInternalSecret)
                    TF_VAR_kiosk_tokens: $(KioskTokens)

                - task: AzureCLI@2
                  displayName: 'Roll container apps to the new images'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az containerapp update \
                        --name "$(frontendContainerApp)" \
                        --resource-group "$(resourceGroup)" \
                        --image "$(registry).azurecr.io/$(frontendRepo):${FRONTEND_SOURCE_TAG}-${BUILD_BUILDID}"
                      az containerapp update \
                        --name "$(apiContainerApp)" \
                        --resource-group "$(resourceGroup)" \
                        --image "$(registry).azurecr.io/$(apiRepo):${API_SOURCE_TAG}-${BUILD_BUILDID}"
                  env:
                    FRONTEND_SOURCE_TAG: ${{ parameters.frontendSourceTag }}
                    API_SOURCE_TAG: ${{ parameters.apiSourceTag }}

                - bash: |
                    set -euo pipefail
                    URL="$(apiBaseUrl)/api/v1/health"
                    for i in 1 2 3 4 5 6; do
                      STATUS="$(curl -s -o /dev/null -w '%{http_code}' "$URL" || echo 000)"
                      echo "attempt $i: HTTP $STATUS"
                      [ "$STATUS" = "200" ] && exit 0
                      sleep 10
                    done
                    echo "API did not return 200 at $URL"
                    exit 1
                  displayName: 'API health check'

                - task: AzureCLI@2
                  displayName: 'Purge Front Door + frontend health check'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az afd endpoint purge \
                        --resource-group "$(resourceGroup)" \
                        --profile-name "$(frontDoorProfile)" \
                        --endpoint-name "$(frontDoorEndpoint)" \
                        --content-paths "/*" \
                        --domains "$(customDomain)" \
                        --no-wait || echo "Front Door purge returned non-zero (continuing)"
                      for i in 1 2 3 4 5 6; do
                        STATUS="$(curl -s -o /dev/null -w '%{http_code}' "https://$(customDomain)" || echo 000)"
                        echo "attempt $i: HTTP $STATUS"
                        [ "$STATUS" = "200" ] && break
                        sleep 10
                      done
