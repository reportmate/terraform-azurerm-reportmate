# ReportMate - deploy (SAMPLE)
#
# Mirrors the published ReportMate images into your Azure Container Registry,
# applies this Terraform module, rolls both container apps to the new tags,
# purges Front Door and checks health. Manual trigger only.
#
# This is a sample derived from a working production pipeline. Adapt every
# value under `variables` before use. Authentication is secretless: an Azure
# Resource Manager service connection using workload identity federation
# (a managed identity or app registration with federated credentials).
#
# Terraform does not roll either image: the containers module sets
# ignore_changes on the container image, so the pipeline owns the running tag
# and pushes it with `az containerapp update`. The -var overrides still matter
# so a from-scratch apply creates the apps with the right tag.

trigger: none
pr: none

parameters:
  - name: frontendSourceTag
    displayName: 'Frontend image tag to mirror from GHCR'
    type: string
    default: 'latest'
  - name: apiSourceTag
    displayName: 'API image tag to mirror from GHCR'
    type: string
    default: 'latest'

pool:
  vmImage: ubuntu-latest

# Secrets come from a variable group (here `reportmate-secrets`) holding
# DbPassword, ClientPassphrase, NextAuthSecret, ApiInternalSecret and
# KioskTokens. Terraform writes them into Key Vault; nothing secret lives in
# this YAML or in the var file.
variables:
  - group: reportmate-secrets
  - name: azureSubscription
    value: '<your-service-connection-name>'
  - name: terraformVersion
    value: '1.12.2'
  - name: terraformDir
    value: '.'
  - name: varFile
    value: 'reportmate.prod.tfvars'
  - name: resourceGroup
    value: 'rg-reportmate'
  - name: registry
    value: '<your-acr-name>'
  - name: frontendRepo
    value: 'reportmate'
  - name: apiRepo
    value: 'reportmate-api'
  - name: frontendGhcrImage
    value: 'ghcr.io/reportmate/reportmate-app-web'
  - name: apiGhcrImage
    value: 'ghcr.io/reportmate/reportmate-api'
  - name: frontendContainerApp
    value: 'reportmate-web-app-prod'
  - name: apiContainerApp
    value: 'reportmate-functions-api'
  - name: apiBaseUrl
    value: 'https://<your-api-app>.<your-environment>.<region>.azurecontainerapps.io'
  - name: frontDoorProfile
    value: 'reportmate-frontdoor'
  - name: frontDoorEndpoint
    value: 'reportmate-endpoint'
  - name: customDomain
    value: 'reportmate.example.com'
  - name: terraformBackendRG
    value: '<your-terraform-state-rg>'
  - name: terraformBackendSA
    value: '<your-terraform-state-storage>'
  - name: terraformBackendContainer
    value: 'terraform-state'
  - name: terraformBackendKey
    value: 'reportmate.tfstate'

steps:
  - checkout: self
    fetchDepth: 0

  - task: AzureCLI@2
    displayName: 'Mirror images (GHCR -> ACR)'
    inputs:
      azureSubscription: $(azureSubscription)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        # `az acr import` copies server-side, so the agent needs no Docker
        # daemon. The GHCR packages are public, so no source credential is needed.
        TS="$(date +%Y%m%d%H%M%S)"
        FRONTEND_TAG="${TS}-${{ parameters.frontendSourceTag }}"
        API_TAG="${TS}-${{ parameters.apiSourceTag }}"
        echo "##vso[task.setvariable variable=frontendTag]$FRONTEND_TAG"
        echo "##vso[task.setvariable variable=apiTag]$API_TAG"
        az acr import --name $(registry) \
          --source "$(frontendGhcrImage):${{ parameters.frontendSourceTag }}" \
          --image "$(frontendRepo):${FRONTEND_TAG}" \
          --image "$(frontendRepo):latest" --force
        az acr import --name $(registry) \
          --source "$(apiGhcrImage):${{ parameters.apiSourceTag }}" \
          --image "$(apiRepo):${API_TAG}" \
          --image "$(apiRepo):latest" --force

  - task: TerraformInstaller@1
    displayName: 'Install Terraform $(terraformVersion)'
    inputs:
      terraformVersion: $(terraformVersion)

  - task: AzureCLI@2
    displayName: 'Terraform Init + Plan'
    inputs:
      azureSubscription: $(azureSubscription)
      addSpnToEnvironment: true
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: $(terraformDir)
      inlineScript: |
        set -euo pipefail
        # The azurerm provider and backend authenticate with OIDC directly;
        # addSpnToEnvironment exposes servicePrincipalId / tenantId / idToken.
        export ARM_USE_OIDC=true ARM_USE_AZUREAD=true
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_TENANT_ID="$tenantId"
        export ARM_OIDC_TOKEN="$idToken"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        terraform init -input=false \
          -backend-config="resource_group_name=$(terraformBackendRG)" \
          -backend-config="storage_account_name=$(terraformBackendSA)" \
          -backend-config="container_name=$(terraformBackendContainer)" \
          -backend-config="key=$(terraformBackendKey)"
        terraform plan -input=false \
          -var-file="$(varFile)" \
          -var="frontend_image_tag=$(frontendTag)" \
          -var="api_image_tag=$(apiTag)" \
          -out=tfplan
        terraform show -no-color tfplan | grep -E "^Plan:|No changes" || true
    # Secret variables are not exported to scripts automatically; map them.
    env:
      TF_VAR_db_password: $(DbPassword)
      TF_VAR_client_passphrases: $(ClientPassphrase)
      TF_VAR_nextauth_secret: $(NextAuthSecret)
      TF_VAR_api_internal_secret: $(ApiInternalSecret)
      TF_VAR_kiosk_tokens: $(KioskTokens)

  - task: AzureCLI@2
    displayName: 'Terraform Apply'
    inputs:
      azureSubscription: $(azureSubscription)
      addSpnToEnvironment: true
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: $(terraformDir)
      inlineScript: |
        set -euo pipefail
        export ARM_USE_OIDC=true ARM_USE_AZUREAD=true
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_TENANT_ID="$tenantId"
        export ARM_OIDC_TOKEN="$idToken"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        terraform apply -input=false -auto-approve tfplan

  - task: AzureCLI@2
    displayName: 'Roll container apps to the new images'
    inputs:
      azureSubscription: $(azureSubscription)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az containerapp update \
          --name $(frontendContainerApp) \
          --resource-group $(resourceGroup) \
          --image $(registry).azurecr.io/$(frontendRepo):$(frontendTag)
        az containerapp update \
          --name $(apiContainerApp) \
          --resource-group $(resourceGroup) \
          --image $(registry).azurecr.io/$(apiRepo):$(apiTag)

  - task: AzureCLI@2
    displayName: 'API health check'
    inputs:
      azureSubscription: $(azureSubscription)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        URL="$(apiBaseUrl)/api/v1/health"
        for i in 1 2 3 4 5 6; do
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' "$URL" || echo 000)"
          echo "attempt $i: HTTP $STATUS"
          [ "$STATUS" = "200" ] && exit 0
          sleep 10
        done
        echo "API did not return 200 at $URL"
        exit 1

  - task: AzureCLI@2
    displayName: 'Purge Front Door + frontend health check'
    inputs:
      azureSubscription: $(azureSubscription)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az afd endpoint purge \
          --resource-group $(resourceGroup) \
          --profile-name $(frontDoorProfile) \
          --endpoint-name $(frontDoorEndpoint) \
          --content-paths "/*" \
          --domains $(customDomain) \
          --no-wait || echo "Front Door purge returned non-zero (continuing)"
        for i in 1 2 3 4 5 6; do
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' "https://$(customDomain)" || echo 000)"
          echo "attempt $i: HTTP $STATUS"
          [ "$STATUS" = "200" ] && break
          sleep 10
        done
